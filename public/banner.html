<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZCC OG Image</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #3d52c8;
        font-family: "Inter", sans-serif;
        display: flex;
        flex-direction: column;
      }

      .bar { width: 100%; height: 8px; background: #dfff00; flex-shrink: 0; }

      .content {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
      }

      .bottom-overlay {
        position: absolute;
        bottom: 0; left: 0; right: 0;
        height: 80px;
        background: rgba(0,0,0,0.3);
      }

      .icon { position: absolute; color: white; }

      .icon-cross-left  { left: 52px;  top: 50%; transform: translateY(-50%); color: #e7453d; opacity: 0.25; }
      .icon-cross-right { right: 52px; top: 50%; transform: translateY(-50%); color: #e7453d; opacity: 0.25; }
      .icon-church-left  { left: 160px; top: 50%; transform: translateY(-50%); opacity: 0.15; }
      .icon-church-right { right: 160px; top: 50%; transform: translateY(-50%); opacity: 0.15; }
      .icon-dove-tl { top: 36px;  left: 120px;  opacity: 0.18; }
      .icon-dove-tr { top: 36px;  right: 120px; opacity: 0.18; }
      .icon-book-bl { bottom: 50px; left: 120px;  opacity: 0.15; }
      .icon-book-br { bottom: 50px; right: 120px; opacity: 0.15; }
      .icon-star-1 { top: 28px;  left: 320px;  color: #dfff00; opacity: 0.25; }
      .icon-star-2 { top: 28px;  right: 320px; color: #dfff00; opacity: 0.25; }

      .corner-cross { position: absolute; opacity: 0.1; }
      .corner-cross .v { position: absolute; width: 4px; height: 32px; background: white; }
      .corner-cross .h { position: absolute; width: 22px; height: 4px; background: white; top: 10px; left: -9px; }
      .tl { top: 28px;  left: 148px; }
      .tr { top: 28px;  right: 148px; }
      .bl { bottom: 50px; left: 148px; }
      .br { bottom: 50px; right: 148px; }

      .logo-circle {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: white;
        border: 4px solid #dfff00;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1.25rem;
        overflow: hidden;
        position: relative;
        z-index: 1;
      }

      .logo-circle img { width: 100%; height: 100%; object-fit: cover; }

      .church-name {
        font-family: "Playfair Display", serif;
        font-size: 50px;
        font-weight: 700;
        color: white;
        text-align: center;
        line-height: 1.15;
        position: relative;
        z-index: 1;
      }

      .divider {
        width: 260px;
        height: 3px;
        background: #e7453d;
        margin: 0.75rem auto;
        position: relative;
        z-index: 1;
      }

      .branch {
        font-size: 20px;
        font-weight: 700;
        color: rgba(255,255,255,0.7);
        letter-spacing: 0.35em;
        text-transform: uppercase;
        position: relative;
        z-index: 1;
      }

      .uhlanga {
        position: absolute;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 13px;
        color: rgba(255,255,255,0.35);
        letter-spacing: 0.4em;
        white-space: nowrap;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div class="bar"></div>

    <div class="content">
      <div class="bottom-overlay"></div>

      <div class="corner-cross tl"><div class="v"></div><div class="h"></div></div>
      <div class="corner-cross tr"><div class="v"></div><div class="h"></div></div>
      <div class="corner-cross bl"><div class="v"></div><div class="h"></div></div>
      <div class="corner-cross br"><div class="v"></div><div class="h"></div></div>

      <div class="icon icon-cross-left">
        <i data-lucide="cross" style="width:80px;height:80px;stroke-width:1.5;"></i>
      </div>
      <div class="icon icon-cross-right">
        <i data-lucide="cross" style="width:80px;height:80px;stroke-width:1.5;"></i>
      </div>
      <div class="icon icon-church-left">
        <i data-lucide="church" style="width:90px;height:90px;stroke-width:1;"></i>
      </div>
      <div class="icon icon-church-right">
        <i data-lucide="church" style="width:90px;height:90px;stroke-width:1;"></i>
      </div>
      <div class="icon icon-dove-tl">
        <i data-lucide="bird" style="width:48px;height:48px;stroke-width:1;"></i>
      </div>
      <div class="icon icon-dove-tr">
        <i data-lucide="bird" style="width:48px;height:48px;stroke-width:1;"></i>
      </div>
      <div class="icon icon-book-bl">
        <i data-lucide="book-open" style="width:48px;height:48px;stroke-width:1;"></i>
      </div>
      <div class="icon icon-book-br">
        <i data-lucide="book-open" style="width:48px;height:48px;stroke-width:1;"></i>
      </div>
      <div class="icon icon-star-1">
        <i data-lucide="star" style="width:22px;height:22px;stroke-width:1;fill:#dfff00;"></i>
      </div>
      <div class="icon icon-star-2">
        <i data-lucide="star" style="width:22px;height:22px;stroke-width:1;fill:#dfff00;"></i>
      </div>

      <div class="logo-circle">
        <img src="zccLogo.png" alt="ZCC Logo" onerror="this.parentElement.innerHTML='<span style=font-size:11px;color:#3d52c8;opacity:0.5;>LOGO</span>'" />
      </div>

      <div class="church-name">Zulu Congregational Church</div>
      <div class="divider"></div>
      <div class="branch">Vryheid Branch</div>
      <div class="uhlanga">"UHLANGA"</div>
    </div>

    <div class="bar"></div>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script>lucide.createIcons();</script>
  </body>
</html>
