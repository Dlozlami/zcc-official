<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZCC Vryheid Branch</title>

    <!-- Open Graph / Link Previews -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="ZCC Vryheid Branch" />
    <meta property="og:title"       content="ZCC Vryheid Branch" />
    <meta property="og:description" content="Zulu Congregational Church, Vryheid Branch — Rooted in faith since 1896." />
    <meta property="og:image"       content="https://zcc-official.vercel.app/public/og-image.png" />
    <meta property="og:url"         content="https://zcc-official.vercel.app" />

    <!-- WhatsApp / Twitter fallback -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="ZCC Vryheid Branch" />
    <meta name="twitter:description" content="Zulu Congregational Church, Vryheid Branch — Rooted in faith since 1896." />
    <meta name="twitter:image"       content="https://zcc-official.vercel.app/public/og-image.png" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --zcc-blue: #3d52c8;
        --zcc-red: #e7453d;
        --zcc-black: #000000;
        --bg-gray: #f8f9fa;
        --white: #ffffff;
        --lime-yellow: #dfff00;
        --nav-height: 60px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        height: 100%;
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg-gray);
        color: var(--zcc-black);
        line-height: 1.5;
        padding-top: var(--nav-height);
        display: flex;
        flex-direction: column;
        min-height: 100%;
      }

      .serif {
        font-family: "Playfair Display", serif;
      }

      /* ─────────────────────────────────────────
         NAVBAR
      ───────────────────────────────────────── */
      .navbar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: var(--nav-height);
        background-color: var(--zcc-blue);
        display: flex;
        align-items: center;
        justify-content: space-between;
        z-index: 1000;
      }

      .navbar-logo {
        height: var(--nav-height);
        width: var(--nav-height);
        object-fit: cover;
        display: block;
      }

      .hamburger {
        background: none;
        border: none;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 5px;
        padding: 6px 1.5rem 6px 6px;
      }

      .hamburger span {
        display: block;
        width: 26px;
        height: 2px;
        background-color: var(--white);
        border-radius: 2px;
        transition: all 0.3s ease;
        transform-origin: center;
      }

      .hamburger.open span:nth-child(1) {
        transform: translateY(7px) rotate(45deg);
      }
      .hamburger.open span:nth-child(2) {
        opacity: 0;
        transform: scaleX(0);
      }
      .hamburger.open span:nth-child(3) {
        transform: translateY(-7px) rotate(-45deg);
      }

      .nav-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 998;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }

      .nav-overlay.open {
        opacity: 1;
        pointer-events: all;
      }

      .nav-drawer {
        position: fixed;
        top: 0;
        left: 0;
        width: 280px;
        height: 100%;
        background-color: var(--zcc-blue);
        z-index: 999;
        transform: translateX(-100%);
        transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        flex-direction: column;
        padding-top: var(--nav-height);
      }

      .nav-drawer.open {
        transform: translateX(0);
      }

      .nav-drawer ul {
        list-style: none;
        padding: 1.5rem 0;
      }

      .nav-drawer ul li a {
        display: block;
        padding: 1rem 2rem;
        color: var(--white);
        text-decoration: none;
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        transition: color 0.2s ease, background 0.2s ease;
      }

      .nav-drawer ul li a:hover {
        background: rgba(255, 255, 255, 0.08);
        color: var(--lime-yellow);
      }

      .nav-drawer ul li a.active {
        color: var(--lime-yellow);
        border-left: 3px solid var(--lime-yellow);
      }

      /* ─────────────────────────────────────────
         PAGE CONTAINER
      ───────────────────────────────────────── */
      .page-container {
        max-width: 800px;
        width: 100%;
        margin: 20px auto;
        background: var(--white);
        box-shadow: 0 10px 50px rgba(0, 0, 0, 0.1);
        border-top: 8px solid var(--zcc-blue);
        flex: 1;
        min-height: calc(100vh - var(--nav-height) - 40px);
      }

      /* ─────────────────────────────────────────
         FOOTER
      ───────────────────────────────────────── */
      footer {
        background-color: var(--zcc-black);
        color: var(--white);
        padding: 2rem;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }

      .footer-grid {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        gap: 2rem;
      }

      @media (min-width: 768px) {
        .footer-grid {
          flex-direction: row;
          align-items: flex-end;
        }
      }

      .footer-left {
        text-align: center;
      }

      @media (min-width: 768px) {
        .footer-left {
          text-align: left;
        }
      }

      .footer-church-name {
        font-size: 1.125rem;
        font-weight: 700;
        line-height: 1;
      }

      .address {
        font-size: 0.875rem;
        color: #9ca3af;
        font-style: normal;
        line-height: 1.25;
        margin-top: 0.25rem;
      }

      .footer-center {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .footer-right {
        text-align: center;
      }

      @media (min-width: 768px) {
        .footer-right {
          text-align: right;
        }
      }

      .uhlanga {
        font-size: 0.875rem;
        font-weight: 700;
        color: #e5e7eb;
        letter-spacing: 0.15em;
      }

      .copyright {
        font-size: 10px;
        color: #6b7280;
        margin-top: 0.5rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      /* ─────────────────────────────────────────
         PRINT
      ───────────────────────────────────────── */
      @media print {
        .navbar,
        .nav-drawer,
        .nav-overlay,
        .no-print {
          display: none !important;
        }
        body {
          background: var(--white) !important;
          padding-top: 0 !important;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
        .page-container {
          box-shadow: none !important;
          margin: 0 !important;
          width: 100% !important;
          max-width: none !important;
          border-top: none !important;
          min-height: unset !important;
        }
        footer {
          background-color: black !important;
          color: white !important;
        }
        .address,
        .copyright {
          color: #555555 !important;
        }
      }
    </style>
  </head>
  <body>

    <!-- ─── NAVBAR ─────────────────────────────── -->
    <nav class="navbar">
      <img src="/public/zccLogo.png" alt="ZCC Logo" class="navbar-logo" />
      <button class="hamburger" id="hamburger" aria-label="Open menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </nav>

    <!-- Overlay -->
    <div class="nav-overlay" id="navOverlay"></div>

    <!-- Slide-out Drawer -->
    <div class="nav-drawer" id="navDrawer">
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/events">Events</a></li>
        <li><a href="/contact">Contact</a></li>
      </ul>
    </div>

    <!-- ─── MAIN CONTENT ──────────────────────── -->
    <div class="page-container">
      <!-- page content goes here -->
    </div>

    <!-- ─── FOOTER ────────────────────────────── -->
    <footer>
      <div class="footer-grid">
        <div class="footer-left">
          <p class="footer-church-name">Zulu Congregational Church</p>
          <address class="address">
            1423 Thusi St, Bhekuzulu<br />
            Vryheid, 3100<br />
            AbaQulusi Local Municipality
          </address>
        </div>

        <div class="footer-center">
          <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--zcc-blue); opacity: 0.8;">
            <path d="M3 21h18" />
            <path d="M5 21V11l7-7 7 7v10" />
            <path d="M9 21v-4a3 3 0 0 1 6 0v4" />
            <path d="M12 2v2" />
            <path d="M11 3h2" />
          </svg>
        </div>

        <div class="footer-right">
          <p class="uhlanga">"UHLANGA"</p>
          <p class="copyright">© 2026 ZCC Vryheid Branch</p>
        </div>
      </div>
    </footer>

    <!-- ─── NAV SCRIPT ─────────────────────────── -->
    <script>
      const hamburger  = document.getElementById("hamburger");
      const navDrawer  = document.getElementById("navDrawer");
      const navOverlay = document.getElementById("navOverlay");

      function openMenu() {
        hamburger.classList.add("open");
        navDrawer.classList.add("open");
        navOverlay.classList.add("open");
        document.body.style.overflow = "hidden";
      }

      function closeMenu() {
        hamburger.classList.remove("open");
        navDrawer.classList.remove("open");
        navOverlay.classList.remove("open");
        document.body.style.overflow = "";
      }

      hamburger.addEventListener("click", () => {
        navDrawer.classList.contains("open") ? closeMenu() : openMenu();
      });

      navOverlay.addEventListener("click", closeMenu);

      navDrawer.querySelectorAll("a").forEach(link => {
        link.addEventListener("click", closeMenu);
      });
    </script>

  </body>
</html>
